name: CI

on:
  push:
    branches: [main, migrate-to-avalonia]
  pull_request:
    branches: [main]

# SixLabors.ImageSharp 4.x and ImageSharp.Drawing 3.x ship a build-time licence check
# (ValidateLicenseTask) that only warns for Debug and fails the build for Release, which is what
# every job below uses. MSBuild reads environment variables as properties, so exporting the key here
# satisfies the task for CrossEscPos.Rendering.ImageSharp and CrossEscPos.Transports — the two
# projects that reference ImageSharp directly and therefore import its targets.
# Add the repository secret SIXLABORS_LICENSE_KEY (this project is public and MIT, so it qualifies
# for the free Six Labors Community licence: https://licensing.sixlabors.com). Until the secret
# exists this resolves to empty and the Release build fails with "No Six Labors license found" —
# deliberately, rather than the check being suppressed.
env:
  SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The browser (WASM) head needs the wasm-tools workload to build.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore CrossEscPos.slnx

      - name: Build
        run: dotnet build CrossEscPos.slnx -c Release --no-restore

      - name: Test
        run: dotnet test CrossEscPos.slnx -c Release --no-build

      - name: Pack libraries
        run: dotnet pack CrossEscPos.slnx -c Release --no-build -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/packages/*.nupkg
          if-no-files-found: warn
