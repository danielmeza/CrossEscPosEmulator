<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CrossEscPos Emulator — WASM</title>
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <div id="out"></div>
    <!-- Startup splash. Avalonia adds .splash-close to #avalonia-splash on its first frame; until then
         main.js prints each downloaded file as a receipt line and keeps the status text current. -->
    <div id="avalonia-splash">
        <div class="splash-printer" aria-hidden="true">
            <div class="splash-window">
                <div class="splash-paper" id="splash-paper"></div>
            </div>
            <div class="splash-body">
                <div class="splash-slot"></div>
                <span class="splash-led"></span>
            </div>
        </div>
        <p class="splash-title">CrossEscPos</p>
        <p class="splash-status" id="splash-status" role="status">Loading the emulator…</p>
        <p class="splash-detail" id="splash-detail"></p>
    </div>
    <!-- Shared browser transports (Web Serial / WebUSB); classic script runs before the deferred module. -->
    <script src="./transports.js"></script>
    <script type="module" src="./main.js"></script>
</body>
</html>
